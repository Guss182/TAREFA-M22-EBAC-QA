name: CI - Cypress e Relatório no GitHub Pages

on:
  push:
    branches: ["exercicios/modulo-4"]
  pull_request:
    branches: ["exercicios/modulo-4"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes-e-publicacao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes (Cypress)
        run: npm test

      - name: Gerar relatório HTML (Mochawesome)
        run: |
          echo "==== Listagem de cypress/reports ===="
          ls -la cypress/reports || true
          echo "==== Listagem de cypress/reports/.jsons ===="
          ls -la cypress/reports/.jsons || true

          shopt -s nullglob

          files=(cypress/reports/.jsons/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            files=(cypress/reports/*.json)
          fi

          if [ ${#files[@]} -eq 0 ]; then
            echo "ERRO: nenhum JSON encontrado para merge."
            echo "Arquivos encontrados em cypress/reports:"
            find cypress/reports -maxdepth 4 -type f -print || true
            exit 1
          fi

          echo "JSONs encontrados:"
          printf '%s\n' "${files[@]}"

          npx mochawesome-merge "${files[@]}" > cypress/reports/mochawesome-merged.json
          npx marge cypress/reports/mochawesome-merged.json -f index -o cypress/reports/html

          test -f cypress/reports/html/index.html

      - name: Salvar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio
          path: cypress/reports/html

      - name: Publicar relatório no GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cypress/reports/html
